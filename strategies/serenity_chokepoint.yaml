instructions: |
  **Serenity 供应链瓶颈投资框架 - 六步分析**

  ## 核心思想

  > **沿着产业链向上游追溯，找到那个"一旦断货，万亿产业就要地震"的关键节点——那个节点上的小盘股/小市值标的，就是下一个暴击机会。**

  ## 六步分析流程（必须严格按顺序执行）

  ### 第一步：定位板块/赛道所处周期阶段

  判断属于哪种周期类型：
  - **需求爆发期**：终端需求暴增，中游扩产来不及，价格上涨，订单排到几年后 → AI算力、固态电池
  - **技术跃迁期**：新技术替代旧技术，旧技术突然被禁，政策打压旧技术补贴新技术 → CPO替代可插拔、HJT替代PERC
  - **供给受限期**：关键原材料被卡/产能有限，报价暴涨，供应商份额成壁垒 → InP衬底、氦气、高纯石英

  ### 第二步：溯源供应链，定位"卡脖子"节点

  从终端向上游逐层排查：
  ```
  终端产品
    ↓
  [最终组装/集成]      ← 是否有产能集中度风险？
    ↓
  [核心零部件]        ← 是否有技术壁垒？
    ↓
  [关键材料/元器件]    ← 是否有原料依赖？国内能否自产？
    ↓
  [上游化工/矿产/稀有气体] ← 是否有资源垄断？
  ```

  **判断标准（满足越多越好）：**
  - ✅ 技术壁垒极高（专利林立、know-how积累深厚）
  - ✅ 产能建设周期长（2-5年扩产窗口）
  - ✅ 国内自给率低（依赖进口）→ 国产替代逻辑
  - ✅ 单一供应商或寡头垄断
  - ✅ 不可替代性高（无备选方案）
  - ✅ 地缘政治风险（出口管制、制裁）

  ### 第三步：找出标的，建立"四维信号卡"

  对每个候选标的，填写：

  | 维度 | 检查内容 |
  |------|---------|
  | **卡脖子定位** | 在这个环节的份额/技术壁垒/专利 |
  | **估值水位** | P/E、P/B、PB在板块内分位 |
  | **资本信号** | 主力净流入、融资融券、龙虎榜 |
  | **机构关注度** | 近期研报覆盖、目标价 |

  ### 第四步：筛选"真瓶颈"与"伪概念" → 六条排除规则

  **严格执行，有一条就剔除：**
  1. ❌ 有业务但不是主营（蹭热点）
  2. ❌ 国内竞争格局分散，无护城河
  3. ❌ 产能扩张太容易（壁垒低）
  4. ❌ 进口替代逻辑不成立（国外也无货）
  5. ❌ 估值已充分反映（过于知名，涨幅已大）
  6. ❌ 无机构关注（日均成交额<5000万，流动性陷阱）

  ### 第五步：多空双向确认（不做单边多头）

  | 做多信号 | 做空/观望信号 |
  |---------|-------------|
  | ✅ 板块主力净流入持续 | ❌ 板块主力净流出 |
  | ✅ 机构开始覆盖（研报出现） | ❌ 无研报、无人问津 |
  | ✅ 产能建设周期>2年（壁垒高） | ❌ 产能半年可达 |
  | ✅ 政策明确支持（文件/补贴） | ❌ 政策压制 |
  | ✅ 筹码集中度提升（散户减少） | ❌ 股东人数暴增 |
  | ✅ 估值分位低于板块平均 | ❌ P/E > 历史80%分位 |

  ### 第六步：输出结构化结论

  最后必须给出：
  - 是否为真瓶颈
  - 估值水位判断
  - 多空对照总结
  - 操作建议（短线/中线/长线）

  ## 评分调整

  - 真瓶颈 + 低估值：`sentiment_score +15`
  - 真瓶颈但估值已高：`sentiment_score +5`，提示等待回调
  - 伪瓶颈：`sentiment_score -20`，建议排除
