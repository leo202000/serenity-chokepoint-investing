name: tao_boshi_momentum
display_name: 陶博士动量体系
description: 陶博士月线反转+口袋支点技术分析体系，结合RPS相对强度
category: framework
core_rules: [1, 2, 3, 4]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases: [月线反转,口袋支点,陶博士,动量体系]
default_active: true
default_router: true
default_priority: 50
market_regimes: [bull_market, trending_up]

instructions: |
  **陶博士动量体系 - 月线反转+口袋支点**

  ## 检查流程（必须严格按顺序）

  1. **RPS 相对强度检查**
     - RPS 120日 > 90 或 RPS 50日 > 87（满足一个即可）
     - 更严格：RPS 120日 > 90 且 RPS 50日 > 87

  2. **结构紧凑检查**
     - 50日内最低价 > 200日内最低价 （底部逐步抬升）
     - OR 30日内最低价 > 120日内最低价
     - OR 20日内最低价 > 50日内最低价
     - 满足一个即可

  3. **创新高检查**
     - 创 70日 新高，且 RPS 满足条件

  4. **均线多头检查**
     - 股价站上 20日线
     - 股价站上 200日线（年线）
     - 120日线 走平或向上
     - 同时满足：`C > MA20 && C > MA200 && MA120 >= REF(MA120, 10)`

  5. **位置检查**
     - 当前股价距离一年新高不到 15%

  6. **月线反转信号确认**
     - 以上条件全部满足 → 出黄色笑脸信号，可以考虑介入

  ## 口袋支点买点确认（月线反转之后）

  **口袋支点定义：**
  - 股价从底部区域突破，放量突破整理平台
  - 突破时成交量明显放大
  - 突破后迅速脱离成本区，很少回踩跌破突破点

  **买点分类（遵循分批验证原则）：**
  1. **第一买点**：月线反转信号出现后立即买入
  2. **第二买点**：首次回踩跌破10日线，低吸买入
  3. **第三买点**：首次回踩跌破20日线，低吸买入
  4. **第四买点**：等待指数中期信号确认后再买入（更稳妥）

  **操作原则：**
  - 只有前一个买点被证明正确（买入后上涨），才考虑下一个更低均线买点
  - 如果10日线买点买入后下跌向50日线移动，直接止损，不越跌越买

  ## 评分调整

  - 如果月线反转+口袋支点都满足：`sentiment_score +10`
  - 如果只满足月线反转，不满足口袋支点位置：`sentiment_score +5`，但标注"等待买点"
  - 如果 RPS 不满足：`sentiment_score -10`，直接排除

  ## 输出模板

  分析完成后按如下格式输出技术面结论：

  ```
  ### 陶博士动量检查

  - **相对强度/RPS：** [满足/不满足，具体数值]
  - **月线反转信号：** [是/否]
  - **站上年线(250日)：** [是/否]
  - **口袋支点形态：** [是/否/等待回踩]
  - **一年新高位置：** [满足/不满足，当前距离新高XX%]
  - **结论：** [通过/等待买点/不通过]
  ```
